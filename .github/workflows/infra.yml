# Deploys / previews the Azure infrastructure defined in infra/main.bicep.
# Pull requests get a "what-if" preview; deployments are run manually.
name: Infrastructure

on:
  pull_request:
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'what-if (preview only) or deploy'
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-clipwave' }}

jobs:
  bicep:
    runs-on: ubuntu-latest
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if preview
        run: |
          az deployment group what-if -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters infra/main.parameters.json \
            --parameters jwtSecret='${{ secrets.JWT_SECRET }}' containerImage="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
      - name: Deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'
        run: |
          az deployment group create -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters infra/main.parameters.json \
            --parameters jwtSecret='${{ secrets.JWT_SECRET }}' containerImage="ghcr.io/${GITHUB_REPOSITORY,,}:latest" \
            --query properties.outputs -o table
