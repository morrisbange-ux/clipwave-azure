# Manually triggered load test (k6) to demonstrate autoscaling.
name: Load test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Base URL to test, e.g. https://clipwave-staging.<region>.azurecontainerapps.io'
        required: true

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6
        run: k6 run -e BASE_URL="${{ inputs.target }}" --summary-export=k6-summary.json load/feed-load.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
